name: Obsidian plugin

# A tag obsidian-X.Y.Z (X.Y.Z being obsidian/manifest.json's version) updates the files the
# community directory reads in chmouel/aniflow-obsidian and creates the X.Y.Z release that
# Obsidian installs from. ANIFLOW_OBSIDIAN_TOKEN is a fine-grained token with contents
# read/write on that repository only.
on:
  push:
    tags: ['obsidian-*']

permissions:
  contents: read

env:
  PLUGIN_REPO: chmouel/aniflow-obsidian

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check the tag against the manifest
        run: |
          version=$(node -p "require('./obsidian/manifest.json').version")
          test "${GITHUB_REF_NAME#obsidian-}" = "$version" || { echo "tag $GITHUB_REF_NAME, manifest $version"; exit 1; }
          node -e "if (!require('./obsidian/versions.json')['$version']) process.exit(1)" || { echo "obsidian/versions.json has no $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run obsidian
      - name: Update the plugin repository
        env:
          GH_TOKEN: ${{ secrets.ANIFLOW_OBSIDIAN_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${PLUGIN_REPO}.git" plugin
          cp obsidian/manifest.json obsidian/versions.json obsidian/README.md obsidian/demo.gif plugin/
          cp LICENSE plugin/LICENSE
          cp src/aniflow/vendor/LICENSE.mermaid src/aniflow/icons/LICENSE.lucide plugin/
          cd plugin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Release $VERSION from chmouel/aniflow@${GITHUB_SHA::12}"
          git push origin HEAD:main
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.ANIFLOW_OBSIDIAN_TOKEN }}
        run: |
          gh release create "$VERSION" --repo "$PLUGIN_REPO" --title "$VERSION" \
            --notes "Built from chmouel/aniflow@${GITHUB_SHA} (tag ${GITHUB_REF_NAME})." \
            obsidian/dist/main.js obsidian/dist/manifest.json obsidian/dist/styles.css
