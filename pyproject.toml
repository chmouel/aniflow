[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aniflow"
version = "0.1.0"
description = "Markdown presentations with animated diagrams and a local document reader"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/aniflow/vendor/LICENSE.*", "src/aniflow/icons/LICENSE.*"]
requires-python = ">=3.12"
authors = [{ name = "Chmouel Boudjnah", email = "chmouel@chmouel.com" }]
keywords = ["markdown", "mermaid", "diagrams", "walkthrough", "slides", "presentations"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chmouel/aniflow"
Issues = "https://github.com/chmouel/aniflow/issues"

[project.scripts]
aniflow = "aniflow.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.sdist]
include = ["src", "js", "js-test", "contrib", "skills", "docs", "tests", "build.mjs", "package.json", "package-lock.json", "README.md", "LICENSE"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "PLW1510"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
